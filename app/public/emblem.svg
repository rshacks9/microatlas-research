<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#2EE6C8" stroke-width="4" stroke-linecap="round">
  <!-- central reticle globe -->
  <g class="emblem-globe">
    <circle cx="256" cy="256" r="120"/>
    <ellipse cx="256" cy="256" rx="52" ry="120"/>
    <ellipse cx="256" cy="256" rx="98" ry="120" opacity="0.45"/>
    <line x1="136" y1="256" x2="376" y2="256" opacity="0.7"/>
    <line x1="256" y1="136" x2="256" y2="376" opacity="0.35"/>
    <!-- crosshair ticks -->
    <line x1="256" y1="72" x2="256" y2="120"/>
    <line x1="256" y1="392" x2="256" y2="440"/>
    <line x1="72" y1="256" x2="120" y2="256"/>
    <line x1="392" y1="256" x2="440" y2="256"/>
    <circle cx="256" cy="256" r="10" fill="#2EE6C8" stroke="none"/>
  </g>
  <!-- dashed orbital ring with satellite ticks -->
  <g class="emblem-ring">
    <circle cx="256" cy="256" r="200" stroke-dasharray="10 14" opacity="0.7"/>
    <rect x="248" y="48" width="16" height="16" fill="#2EE6C8" stroke="none" transform="rotate(30 256 256)"/>
    <rect x="248" y="48" width="16" height="16" fill="#2EE6C8" stroke="none" transform="rotate(150 256 256)"/>
    <rect x="248" y="48" width="16" height="16" fill="#FFB020" stroke="none" transform="rotate(265 256 256)"/>
  </g>
  <!-- degree tick marks 0/90/180/270 -->
  <g stroke-width="6">
    <line x1="256" y1="16" x2="256" y2="34"/>
    <line x1="256" y1="478" x2="256" y2="496"/>
    <line x1="16" y1="256" x2="34" y2="256"/>
    <line x1="478" y1="256" x2="496" y2="256"/>
  </g>
  <g stroke-width="3" opacity="0.5">
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(30 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(60 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(120 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(150 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(210 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(240 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(300 256 256)"/>
    <line x1="256" y1="20" x2="256" y2="32" transform="rotate(330 256 256)"/>
  </g>
</svg>
